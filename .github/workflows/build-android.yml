name: Build GrillFlow Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Firebase Android configuration
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os

          from firebase_auth import ANDROID_PACKAGE, FIREBASE_CONFIG, FirebaseAuth

          raw = os.environ.get("FIREBASE_CONFIG_JSON", "").removeprefix("\ufeff")
          if not raw.strip():
              raise SystemExit("Missing repository secret FIREBASE_CONFIG_JSON.")
          try:
              config = json.loads(raw)
              project = config["project_info"]["project_id"]
              clients = config["client"]
              matches = [
                  client for client in clients
                  if client["client_info"].get("android_client_info", {}).get("package_name")
                  == ANDROID_PACKAGE
              ]
              keys = {
                  entry["current_key"].strip() for client in matches for entry in client["api_key"]
                  if entry["current_key"].strip()
              }
          except (ValueError, KeyError, TypeError, AttributeError):
              raise SystemExit("FIREBASE_CONFIG_JSON must be a valid Firebase Android client configuration.") from None
          if project != "grillflow" or not matches or len(keys) != 1:
              raise SystemExit("Firebase config must match project grillflow, package com.grillflow.app, and one API key.")

          def contains_private_credentials(value):
              if isinstance(value, dict):
                  return any(key in {"private_key", "client_secret", "refresh_token", "service_account"}
                             or contains_private_credentials(item) for key, item in value.items())
              if isinstance(value, list):
                  return any(contains_private_credentials(item) for item in value)
              return value == "service_account"

          if contains_private_credentials(config):
              raise SystemExit("Use the Firebase Android client configuration, never a service account key or token.")
          os.umask(0o077)
          with FIREBASE_CONFIG.open("x", encoding="utf-8") as file:
              file.write(raw)
          auth = FirebaseAuth.from_project_config(None, android=True)
          if auth.project != project or auth.api_key not in keys:
              raise SystemExit("The app could not read the restored Firebase configuration.")
          print("Firebase Android client configuration validated.")
          PY

      - name: Install Android build dependencies
        run: |
          df -h "$GITHUB_WORKSPACE"
          # Remove only unrelated toolchains from this disposable runner.
          sudo rm -rf -- /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip autoconf automake autopoint gettext libtool libltdl-dev \
            pkg-config cmake zlib1g-dev libncurses-dev libtinfo6 libffi-dev libssl-dev \
            libbz2-dev libreadline-dev libsqlite3-dev liblzma-dev
          # Kivy's recipe installs its own Cython in p4a's separately built hostpython.
          python -m pip install --disable-pip-version-check 'buildozer==1.6.0' 'Cython==0.29.37' setuptools
          python -m pip check
          python --version
          java -version
          buildozer --version
          cython --version
          df -h "$GITHUB_WORKSPACE"

      - name: Build signed debug APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: 'True'
        run: buildozer -v android debug

      - name: Validate APK and record checksum
        id: apk
        run: |
          shopt -s nullglob
          apks=(bin/*.apk)
          if (( ${#apks[@]} != 1 )) || [[ ! -s "${apks[0]}" ]]; then
            echo "::error::Expected exactly one nonempty debug APK in bin/."
            exit 1
          fi
          apk="${apks[0]}"
          tools_root="$HOME/.buildozer/android/platform/android-sdk/build-tools"
          aapt=$(find "$tools_root" -type f -name aapt | sort -V | tail -n 1)
          test -x "$aapt"
          signer_details=$("${aapt%/*}/apksigner" verify --print-certs "$apk")
          signer_sha1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' <<< "$signer_details")
          [[ "$signer_sha1" =~ ^[0-9a-fA-F]{40}$ ]]
          badging=$("$aapt" dump badging "$apk")
          grep -qF "package: name='com.grillflow.app'" <<< "$badging"
          grep -qF "application-label:'GrillFlow'" <<< "$badging"
          grep -qF "sdkVersion:'23'" <<< "$badging"
          grep -qF "targetSdkVersion:'34'" <<< "$badging"
          grep -qF "native-code: 'arm64-v8a'" <<< "$badging"
          grep -qF "uses-permission: name='android.permission.INTERNET'" <<< "$badging"
          python - "$apk" <<'PY'
          import sys
          import tarfile
          from zipfile import ZipFile

          from firebase_auth import FIREBASE_CONFIG

          with ZipFile(sys.argv[1]) as apk, apk.open("assets/private.tar") as archive:
              with tarfile.open(fileobj=archive, mode="r|*") as bundle:
                  for member in bundle:
                      if member.name.removeprefix("./") == FIREBASE_CONFIG.name and member.isfile():
                          if bundle.extractfile(member).read() == FIREBASE_CONFIG.read_bytes():
                              break
                          raise SystemExit("The packaged Firebase configuration differs from the validated input.")
                  else:
                      raise SystemExit("The Firebase configuration is missing from the Android runtime bundle.")
          PY
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          {
            echo '### GrillFlow Android debug APK'
            printf '\n- File: `%s`\n- Size: %s bytes\n- SHA-256: `%s`\n- Signing SHA-1: `%s`\n' \
              "${apk##*/}" "$(stat -c %s "$apk")" "$(sha256sum "$apk" | cut -d ' ' -f 1)" "$signer_sha1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: GrillFlow-Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Diagnose a failed build
        if: failure()
        run: |
          df -h "$GITHUB_WORKSPACE"
          platform_dir="$HOME/.buildozer/android/platform"
          if [[ -d "$platform_dir" ]]; then
            find "$platform_dir" -name source.properties -maxdepth 4 -print
            du -sh "$platform_dir"/* || true
          fi
